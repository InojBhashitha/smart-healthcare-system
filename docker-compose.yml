version: '3.8'

services:
  # ── PostgreSQL Database Container ─────────────────────────────────────
  postgres-db:
    image: postgres:15-alpine
    container_name: smart-healthcare-db
    environment:
      POSTGRES_DB: smart_healthcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smarthealth123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Python AI Microservice (TrOCR + PyTesseract) ─────────────────────
  ai-service:
    build: ./ai-service
    container_name: smart-healthcare-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  # ── Spring Boot Backend Core ──────────────────────────────────────────
  backend:
    build: ./backend
    container_name: smart-healthcare-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/smart_healthcare
      - DB_USERNAME=postgres
      - DB_PASSWORD=smarthealth123
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=MySuperSecretKeyForSmartHealthcareSystem2026MySuperSecretKey
    depends_on:
      postgres-db:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: always

volumes:
  postgres_data:
