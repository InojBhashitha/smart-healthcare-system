# ── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_healthcare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:smarthealth123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Server ────────────────────────────────────────────────
server.port=8081

# ── Logging ───────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.smarthealthcare=INFO

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:MySuperSecretKeyForSmartHealthcareSystem2026MySuperSecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}
