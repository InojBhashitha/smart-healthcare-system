# ── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_healthcare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:smarthealth123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Server & Monitoring ──────────────────────────────────
server.port=8080
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:MySuperSecretKeyForSmartHealthcareSystem2026MySuperSecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Tesseract OCR ─────────────────────────────────────────
tesseract.data.path=${TESSERACT_DATA_PATH:/usr/share/tesseract-ocr/5/tessdata}

# ── AI Microservice (Python FastAPI) ─────────────────────
ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# ── Multipart Upload ─────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ───────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.smarthealthcare=INFO